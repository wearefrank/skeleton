name: Lint Architectural Decision Records

on:
  pull_request:
    branches:
      - main
      - master
      - '[0-9]+.x'
      - '[0-9]+.[0-9]+.x'
      - next
      - next-major
    paths:
      - "docs/decisions/**"
      - ".github/skills/write-adr/**"
      - ".claude/skills/write-adr/**"
      - ".github/workflows/lint-decisions.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1

      # Uses the rules in docs/decisions/.markdownlint.yml
      - name: Lint ADRs
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: docs/decisions/**/*.md

      - name: Check skill copies are identical
        run: diff --recursive .github/skills/write-adr .claude/skills/write-adr
