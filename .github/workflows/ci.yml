name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  version-next:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version-next: ${{ steps.reference.outputs.next-reference }}
      version-next-strict: ${{ steps.reference.outputs.next-reference }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1

      - name: Next Reference
        id: reference
        uses: wearefrank/ci-cd-templates/next-reference@b8eabd63f33049bb804be55918652ab50c69f730 #2.5.1

  ci:
    uses: wearefrank/ci-cd-templates/.github/workflows/ci-generic.yml@b8eabd63f33049bb804be55918652ab50c69f730 #2.5.1
    needs:
      - version-next
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    with:
      version: ${{ needs.version-next.outputs.version-next }}
